[package]
name = "dokimi-assert-tokio"
description = "The assertions of dokimi-assert whose subject is a future, for tests on tokio"
documentation = "https://docs.rs/dokimi-assert-tokio"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
# The specs stay out of the package.
include = ["/src", "/LICENSE", "/README.md"]
# The specs build as one binary, tests/main.rs.
autotests = false

[lints]
workspace = true

[dependencies]
dokimi-assert.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "macros", "test-util"] }

# The specs of the crate. Each source file under src/ has its spec at the
# same path under tests/.
[[test]]
name = "spec"
path = "tests/main.rs"
