[package]
name = "dokimi-assert"
description = "Test assertions defined by a language-neutral standard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true

[lints]
workspace = true

# regex, because Rust's standard library has none and the standard
# states an assertion that matches a pattern. This crate is itself a
# dev-dependency, so nothing here reaches a consumer's binary.
[dependencies]
regex = "1.13.1"

[dev-dependencies]
serde_json = "1.0.151"
