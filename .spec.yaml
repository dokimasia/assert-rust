# The copy of the definition of assert-spec, which spec sync writes and spec check verifies. The
# crate dokimi-assert-conformance reads the copy beside its sources, and the shapes of the crate
# dokimi-assert embed their copy of the zone table.
implements:
  - definition: dokimasia/assert-spec
    path: crates/dokimi-assert-conformance
    languages: [rust]
    copies:
      - {from: spec/zones.json, to: crates/dokimi-assert/src/prop/shape/zones.json}
    test: [make, test]
