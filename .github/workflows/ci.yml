name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting, clippy and the documentation, on the stable toolchain.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Document, refusing a warning or a broken link
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # The tests, the doctests included, on each system that the crates support.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Test
        run: cargo test --workspace --all-features

  # The oldest Rust that rust-version states. The crates support it only
  # while they build on it.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain
        run: rustup toolchain install 1.85 --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check
        run: rustup run 1.85 cargo check --workspace --all-targets --all-features

  # Every line and every function of the published crates runs in a test.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview --no-self-update
          rustup default stable

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Measure the coverage
        run: make coverage

  # The licences, the security advisories and the sources of the
  # dependencies, as deny.toml states them.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # cargo package builds each published crate from the files of its
  # package, so a file that the package leaves out fails here.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Package every published crate
        run: cargo package --workspace

  # spec check fails for a vendored definition that differs from its
  # manifest, and for a copy whose commit is not on the branch main of
  # assert-spec. The workflow spec.yml proposes a newer copy.
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: stealth-scale/spec/.github/actions/setup-spec@78d70fd5be63102e43f8dd9628d4594914bb390e # v0.2.0
        with:
          version: v0.2.0

      - name: Check the vendored definition
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: spec check --remote
