# Opens a pull request with the copy of the head of the branch main of assert-spec on each weekday
# when the vendored copy is behind it, and closes the pull request when the copy matches again. The
# workflow propose.yml of spec writes the pull request with the token of the GitHub App of the
# variable ERGON_APP_CLIENT_ID and the secret ERGON_APP_PRIVATE_KEY.
name: Spec

on:
  schedule:
    - cron: "0 7 * * 1-5"
  workflow_dispatch:

permissions: {}

jobs:
  propose:
    uses: stealth-scale/spec/.github/workflows/propose.yml@78d70fd5be63102e43f8dd9628d4594914bb390e # v0.2.0
    with:
      version: v0.2.0
    secrets: inherit
